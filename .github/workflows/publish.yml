name: publish

# Publishes prism-core, prism-bukkit, prism-brigadier, prism-paper and prism-spigot
# to Maven Central.
#
#  - push a tag like v1.0.0 or v1.0.0-beta.2  -> uploads AND releases that version
#  - run it manually from the Actions tab      -> uploads; tick "release" to release it too,
#                                                 otherwise review/release it in the Central Portal

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.0-beta.2 (no leading v)"
        required: true
      release:
        description: "Release automatically after upload (otherwise release it manually in the Central Portal)"
        type: boolean
        default: false

# Never run two publishes at once, and never cancel one that is already running.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      JAVA_INSTALLATIONS: JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
    steps:
      - uses: actions/checkout@v4

      # 17 = library code, 21 = tests / 1.21 NMS, 25 = brigadier-paper / 26.x NMS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Resolve version and publish task
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if [ "$INPUT_RELEASE" = "true" ]; then
              TASK="publishAndReleaseToMavenCentral"
            else
              TASK="publishToMavenCentral"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TASK="publishAndReleaseToMavenCentral"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid release version (SNAPSHOTs cannot go to Maven Central)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"

      # Maven Central releases are permanent, so don't publish anything that doesn't pass.
      - name: Test
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: >
          ./gradlew test
          "-Pversion=$VERSION"
          "-Porg.gradle.java.installations.fromEnv=$JAVA_INSTALLATIONS"

      - name: Publish
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TASK: ${{ steps.meta.outputs.task }}
        run: >
          ./gradlew "$TASK"
          "-Pversion=$VERSION"
          "-Porg.gradle.java.installations.fromEnv=$JAVA_INSTALLATIONS"
          --no-configuration-cache